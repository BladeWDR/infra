# ---------------------------------------------------------------------------
# Debian 13 (Trixie) netinst preseed — rendered by Packer's templatefile().
# build_password / build_user / timezone are injected from the var file.
# Served over Packer's built-in HTTP server to the installing VM.
#
# NOTE: this file is a Packer/Go template. Do NOT add literal dollar signs
# except the injection points above (timezone, build_user, build_password).
# ---------------------------------------------------------------------------

# --- Only stop on critical errors ---
d-i priority critical

# --- Localization ---
d-i debian-installer/locale string en_US.UTF-8
d-i debian-installer/language string en
d-i debian-installer/country string US
d-i localechooser/supported-locales multiselect en_US.UTF-8

# --- Keyboard ---
d-i keyboard-configuration/xkb-keymap select us
d-i keyboard-configuration/layoutcode string us
d-i keyboard-configuration/modelcode string pc105

# --- Clock / timezone ---
d-i clock-setup/utc boolean true
d-i time/zone string ${timezone}
d-i clock-setup/ntp boolean true

# --- Network: DHCP on the first interface, public DNS (1.1.1.1, 9.9.9.9) ---
d-i netcfg/choose_interface select auto
d-i netcfg/get_nameservers string 1.1.1.1 9.9.9.9
d-i netcfg/get_hostname string packer-build
d-i netcfg/get_domain string localdomain

# Force public DNS (1.1.1.1, 9.9.9.9) inside both the installer (/) and /target
# before apt-setup ('Configure the package manager') runs inside /target.
d-i preseed/early_command string printf "nameserver 1.1.1.1\nnameserver 9.9.9.9\n" > /etc/resolv.conf && mkdir -p /usr/lib/base-installer.d && printf "#!/bin/sh\nprintf 'nameserver 1.1.1.1\nnameserver 9.9.9.9\n' > /target/etc/resolv.conf\n" > /usr/lib/base-installer.d/99dns && chmod +x /usr/lib/base-installer.d/99dns

# --- Mirror (public; swap for an internal mirror if you prefer) ---
d-i mirror/country string manual
d-i mirror/protocol string http
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i mirror/suite string stable

# --- APT setup (don't prompt to scan additional CDs/DVDs) ---
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false
d-i apt-setup/cdrom/set-double boolean false
d-i apt-setup/use_mirror boolean true
d-i popularity-contest/participate boolean false

# --- Partitioning: wipe the first disk, single root (with EFI under OVMF), no LVM ---
d-i partman-auto/method string regular
d-i partman-auto/disk string /dev/sda
d-i partman-efi/non_efi_system boolean true
d-i partman-partitioning/choose_label select gpt
d-i partman-partitioning/default_label string gpt
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman-partitioning/confirm_nooverwrite boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman/confirm boolean true

# --- Base system + SSH server + QEMU guest agent (so Proxmox reports IP to Packer) ---
tasksel tasksel/first multiselect standard
d-i pkgsel/include string openssh-server qemu-guest-agent sudo
d-i pkgsel/language-packages multiselect none
d-i pkgsel/install-language-support boolean false
d-i apt-setup/cdrom/set-first boolean false

# --- Build user (temporary; locked after provisioning) ---
d-i user-setup/allow-password-weak boolean true
d-i passwd/user-fullname string Packer Build
d-i passwd/username string ${build_user}
d-i passwd/user-password password ${build_password}
d-i passwd/user-password-again password ${build_password}

# Leave root without a password; Ansible adds the SSH key + NOPASSWD sudo.
d-i passwd/root-login boolean false

# --- Late command: passwordless sudo in installed OS (/target) ---
# DNS on cloned VMs is handled by cloud-init via the netplan renderer
# (provision.yml installs netplan + systemd-resolved and forces the netplan
# renderer), matching how the Ubuntu cloud-init VMs get their DNS.
d-i preseed/late_command string mkdir -p /target/etc/sudoers.d && echo "${build_user} ALL=(ALL) NOPASSWD:ALL" > /target/etc/sudoers.d/${build_user} && chmod 0440 /target/etc/sudoers.d/${build_user}

# --- Install the GRUB bootloader on the first drive only ---
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default

# --- Unattended: don't prompt for upgrades, reboot at the end ---
d-i finish-install/reboot_in_progress note
