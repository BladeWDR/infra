- name: Update tailscale to latest.
  hosts: all
  become: true

  tasks:

    - name: Update tailscale. (Debian)
      ansible.builtin.apt:
        name: tailscale
        state: latest
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts['os_family'] == 'Debian'

    - name: Update tailscale. (RHEL)
      ansible.builtin.dnf:
        name: tailscale
        state: latest
      when: ansible_facts['os_family'] == 'RedHat'
