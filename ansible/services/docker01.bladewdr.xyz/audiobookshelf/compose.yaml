---
services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:2.36.0@sha256:180acad33d69c99ed208676465d8edcb268fa46967735579a7810859885b1a8e 
    container_name: audiobookshelf
    networks:
      - traefik
    extra_hosts:
      - "pinchflat.a.bladewdr.xyz:10.13.37.11"
    volumes:
      - /apps/audiobookshelf/config:/config
      - /apps/audiobookshelf/metadata:/metadata
      - media:/mnt/media
    environment:
      - TZ={{ host_timezone }}
      - DISABLE_SSRF_REQUEST_FILTER=1
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.audiobookshelf.tls=true
      - traefik.http.routers.audiobookshelf.entrypoints=websecure
      - traefik.http.routers.audiobookshelf.middlewares=default-headers@file
      - traefik.http.routers.audiobookshelf.service=audiobookshelf
      - traefik.docker.network=traefik
      - traefik.http.services.audiobookshelf.loadbalancer.server.port=80
      - traefik.http.routers.audiobookshelf.rule=Host(`audiobook.{{ TRAEFIK_HOST_DOMAIN }}`)
