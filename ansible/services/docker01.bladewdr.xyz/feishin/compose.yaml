---
services:
  feishin:
    image: ghcr.io/jeffvli/feishin:1.15.1@sha256:5c0b3a1f307f8d9508c9fd5dcef04349b6cda1740ae95d478498dc86e3e432bf
    container_name: feishin
    restart: unless-stopped
    volumes:
      - /etc/localtime:/etc/localtime:ro
    environment:
      - SERVER_NAME=Navidrome
      - SERVER_LOCK=${FEISHIN_SERVER_LOCK:-true} # When true AND name/type/url are set, only username/password can be toggled
      - SERVER_TYPE=navidrome
      - SERVER_URL=https://{{ NAVIDROME_HOST }}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - UMASK=002
      - TZ=America/New_York
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.http.routers.feishin.entrypoints=websecure
      - traefik.http.routers.feishin.rule=Host(`feishin.{{ TRAEFIK_HOST_DOMAIN }}`)
      - traefik.http.routers.feishin.service=feishin
      - traefik.http.services.feishin.loadbalancer.server.port=9180
      - traefik.http.routers.feishin.middlewares=default-headers@file
      - traefik.http.routers.feishin.tls=true
      - traefik.docker.network=traefik
