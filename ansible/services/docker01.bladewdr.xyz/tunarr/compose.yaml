---
services:
  tunarr:
    image: chrisbenincasa/tunarr:1.3.15@sha256:ae8ec490459e773571b277e2f64248605c1ea64d49ee4d26aa01741409d60369 
    container_name: tunarr
    ports:
      - 8000:8000
    environment:
      - TZ={{ host_timezone }}
    volumes:
      - /home/{{ admin_username }}/docker/tunarr:/config/tunarr
      - media:/media:ro
      - type: tmpfs
        target: /root/.local/share/etv-transcode
    devices:
      - /dev/dri:/dev/dri
    restart: unless-stopped
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.http.routers.tunarr.entrypoints=websecure
      - traefik.http.routers.tunarr.rule=Host(`tunarr.{{ TRAEFIK_HOST_DOMAIN }}`)
      - traefik.http.routers.tunarr.service=tunarr
      - traefik.http.services.tunarr.loadbalancer.server.port=8000
      - traefik.http.routers.tunarr.middlewares=default-headers@file
      - traefik.http.routers.tunarr.tls=true
      - traefik.docker.network=traefik
