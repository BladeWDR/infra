---
services:
  unmanic:
    container_name: unmanic
    image: josh5/unmanic:latest@sha256:36a705923193db6b8ca7abd5b57b81a7309d04aedd320ec0ef4e9ac5970be885
    devices:
      - /dev/dri:/dev/dri
    group_add:
          - "992"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ={{ host_timezone }}
    volumes:
      - ./config:/config
      - ./tmp:/tmp/unmanic
      - media:/mnt/media
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.http.routers.unmanic.entrypoints=websecure
      - traefik.http.routers.unmanic.rule=Host(`unmanic.{{ TRAEFIK_HOST_DOMAIN }}`)
      - traefik.http.routers.unmanic.service=unmanic
      - traefik.http.services.unmanic.loadbalancer.server.port=8888
      - traefik.http.routers.unmanic.middlewares=default-headers@file
      - traefik.http.routers.unmanic.tls=true
      - traefik.docker.network=traefik
