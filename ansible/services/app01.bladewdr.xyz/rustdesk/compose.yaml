---
services:
  hbbs:
    container_name: rustdesk-hbbs
    image: rustdesk/rustdesk-server:1.1.16@sha256:8ecdab65deb7c84652a626380e31d11a8f1fbafd97916d57f95c20628f943c00
    # the -k _ option prevents users from creating unencrypted connections.
    command: hbbs -k _
    volumes:
      - /apps/rustdesk/data:/root
    ports:
      - 21115:21115/tcp
      - 21116:21116/tcp
      - 21116:21116/udp
    depends_on:
      - hbbr
    restart: unless-stopped

  hbbr:
    container_name: rustdesk-hbbr
    image: rustdesk/rustdesk-server:1.1.16@sha256:8ecdab65deb7c84652a626380e31d11a8f1fbafd97916d57f95c20628f943c00
    command: hbbr -k _
    volumes:
      - /apps/rustdesk/data:/root
    ports:
      - 21117:21117/tcp
    restart: unless-stopped
