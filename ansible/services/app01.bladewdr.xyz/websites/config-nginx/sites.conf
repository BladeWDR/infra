server {
    listen 80;
    server_name blog.ssb-tech.net www.blog.ssb-tech.net;
    root /var/www/blog.ssb-tech.net;
    index index.html index.htm;
    absolute_redirect off;
}

server {
    listen 80;
    server_name links.{{ APP0_HOST_DOMAIN }} www.links.{{ APP0_HOST_DOMAIN }};
    root /var/www/littlelink;
    index index.html index.htm;
    absolute_redirect off;
}

server {
    listen 80;
    server_name scottbarning.com www.scottbarning.com;
    root /var/www/scottbarning.com;
    index index.html index.htm;
    absolute_redirect off;
}

server {
    listen 80;
    server_name ssb-tech.net;
    root /var/www/ssb-tech.net;
    absolute_redirect off;

    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;

    auth_basic "Speak 'friend' and enter:";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location ~ /\. {
        deny all;
    }
}
