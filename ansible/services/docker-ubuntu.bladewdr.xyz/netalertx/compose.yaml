---
services:
  netalertx:
    network_mode: host
    restart: unless-stopped
    read_only: true
    mem_limit: 2048m
    mem_reservation: 1024m
    cpu_shares: 512
    pids_limit: 512
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    volumes:
      - type: bind
        source: ./netalertx/data
        target: /data
        read_only: false
      - type: tmpfs
        target: /app/api
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
    environment:
      - PUID=200
      - PGID=300
      - TZ={{ host_timezone }}
      - PORT=20211
    container_name: netalertx
    image: jokobsk/netalertx:26.8.5@sha256:e8d800176d35a2fcc856ddc68c354a6b472e535c6ed42c52d040b715ca9bb127
    tmpfs:
      - "/tmp:mode=1777,rw,noexec,nosuid,nodev,async,noatime,nodiratime"
    labels:
      - traefik.enable=true
      - traefik.http.routers.netalertx.rule=Host(`netalert.{{ TRAEFIK_HOST_DOMAIN }}`)
      - traefik.http.routers.netalertx.entrypoints=https
      - traefik.http.routers.netalertx.tls=true
      - traefik.http.routers.netalertx.middlewares=default-headers@file
      - traefik.http.routers.netalertx.service=netalertx
      - traefik.http.services.netalertx.loadbalancer.server.port=20211
