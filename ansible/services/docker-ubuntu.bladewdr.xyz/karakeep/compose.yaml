services:
  web:
    image: ghcr.io/karakeep-app/karakeep:0.33.2@sha256:b069e4307dec06ea06d16989c6861c30a1ff208568be44ed5fb5d422cd3e950c
    container_name: hoarder-web
    networks:
      - proxy
    restart: unless-stopped
    volumes:
      - ./karakeep/data:/data
    depends_on:
      - meilisearch
      - chrome
    environment:
      - DATA_DIR=/data
      - HOARDER_VERSION=release
      - NEXTAUTH_SECRET={{ KARAKEEP_NEXTAUTH_SECRET }}
      - MEILI_MASTER_KEY={{ KARAKEEP_MEILI_MASTER_KEY }}
      - NEXTAUTH_URL=https://{{ KARAKEEP_HOST }}
      - DISABLE_SIGNUPS=true
      - OAUTH_CLIENT_SECRET={{ KARAKEEP_OAUTH_CLIENT_SECRET }}
      - OAUTH_CLIENT_ID={{ KARAKEEP_OAUTH_CLIENT_ID }}
      - OAUTH_WELLKNOWN_URL=https://{{ AUTHENTIK_HOST }}/application/o/hoarder/.well-known/openid-configuration
      - OAUTH_PROVIDER_NAME=Authentik
      - OAUTH_SCOPE=openid email profile
      - MEILI_NO_ANALYTICS=true
      - MEILI_ADDR=http://hoarder-meilisearch:7700
      - BROWSER_WEB_URL=http://hoarder-chrome:9222
      - OLLAMA_BASE_URL=https://ollama.{{ TRAEFIK_HOST_DOMAIN }}
      - INFERENCE_TEXT_MODEL=llama3.2:3b
      - INFERENCE_IMAGE_MODEL=llama3.2:3b
      - INFERENCE_JOB_TIMEOUT_SEC=60
      - EMBEDDING_TEXT_MODEL=llama3.2:3b
    labels:
      - traefik.enable=true
      - traefik.http.routers.hoarder.entrypoints=https
      - traefik.http.routers.hoarder.rule=Host(`{{ KARAKEEP_HOST }}`)
      - traefik.http.services.hoarder.loadbalancer.server.port=3000
      - traefik.http.routers.hoarder.middlewares=default-headers@file
      - traefik.http.routers.hoarder.tls=true
  chrome:
    image: ghcr.io/karakeep-app/karakeep-chrome:release@sha256:5b19bbb160e9ff60681a3abd97e1c4ec9f64212301410de658c3900ab7ef31e7
    restart: unless-stopped
    container_name: hoarder-chrome
    init: true
    networks:
      - proxy
    command:
      - --disable-gpu
      - --disable-dev-shm-usage
      - --hide-scrollbars
      - --disable-blink-features=AutomationControlled
      - --window-size=1440,900
  meilisearch:
    container_name: hoarder-meilisearch
    networks:
      - proxy
    environment:
      - MEILI_NO_ANALYTICS=true
      - MEILI_ADDR=http://hoarder-meilisearch:7700
      - MEILI_MASTER_KEY={{ KARAKEEP_MEILI_MASTER_KEY }}
      - MEILI_EXPERIMENTAL_DUMPLESS_UPGRADE=true
    image: getmeili/meilisearch:v1.53.1@sha256:8d6643d86d71fad6ad3cba92cde7ccfce9e4d6c384bda67598eb553571c32431
    restart: unless-stopped
    volumes:
      - ./karakeep/meilisearch:/meili_data
    healthcheck:
      retries: 3
      test: set -o pipefail;curl -fsS http://localhost:7700/health | grep -q '{"status":"available"}'
      timeout: 5s

networks:
  proxy:
    external: true
