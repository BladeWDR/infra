services:
  changedetection:
    image: ghcr.io/dgtlmoon/changedetection.io:0.55.8@sha256:5438423d5e906eff4e8f7886823482ad23f472bf7b8530ccaca89fb48c337882
    container_name: changedetection
    networks:
      - proxy
    hostname: changedetection
    volumes:
      - /apps/changedetection:/datastore
    labels:
      - traefik.enable=true
      - traefik.http.routers.changedetection.rule=Host(`changedetection.{{ TRAEFIK_HOST_DOMAIN }}`)
      - traefik.http.routers.changedetection.entrypoints=https
      - traefik.http.routers.changedetection.middlewares=default-headers@file
      - traefik.http.routers.changedetection.tls=true
      - traefik.http.routers.changedetection.service=changedetection
      - traefik.http.services.changedetection.loadbalancer.server.port=5000
    environment:
      - LOGGER_LEVEL=DEBUG
      - BASE_URL=https://changedetection.{{ TRAEFIK_HOST_DOMAIN }}
      - USE_X_SETTINGS=1
      - HIDE_REFERER=true
      - DISABLE_VERSION_CHECK=true
      - TZ={{ host_timezone }}
      - PLAYWRIGHT_DRIVER_URL=ws://browser-sockpuppet-chrome:3000
    restart: unless-stopped

  browser-sockpuppet-chrome:
    hostname: browser-sockpuppet-chrome
    networks:
      - proxy
    image: dgtlmoon/sockpuppetbrowser@sha256:f166a963b550c29af465c2fac518212e7e3a75f14f0d2b840cf4b79677295764
    cap_add:
      - SYS_ADMIN
    restart: unless-stopped
    environment:
      - SCREEN_WIDTH=1920
      - SCREEN_HEIGHT=1024
      - SCREEN_DEPTH=16
      - MAX_CONCURRENT_CHROME_PROCESSES=10
