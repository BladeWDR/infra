---
volumes:
  kiwix-data:
    labels:
      - remove_volume_on=down
    driver_opts:
      type: nfs
      o: "addr=nas01.bladewdr.xyz,nolock,noatime,soft,rw"
      device: ":/mnt/tank/kiwix"

networks:
  proxy:
    external: true

services:
  kiwix-serve:
    container_name: kiwix
    image: ghcr.io/kiwix/kiwix-serve:3.8.2@sha256:e478554a9920412eeb5ce1d73f24e4b28445ebed233187cdd03c623c32be46a5
    networks:
      - proxy
    volumes:
      - kiwix-data:/data
    command:
      - '*.zim'
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.kiwix.entrypoints=https
      - traefik.http.routers.kiwix.rule=Host(`kiwix.{{ TRAEFIK_HOST_DOMAIN }}`)
      - traefik.http.routers.kiwix.tls=true
      - traefik.http.middlewares.kiwix=default-headers@file
      - traefik.http.middlewares.kiwix=https-redirectscheme@file
      - traefik.http.routers.kiwix.middlewares=default-headers@file
      - traefik.http.services.kiwix.loadbalancer.server.port=8080
      - traefik.http.routers.kiwix.service=kiwix
      - traefik.docker.network=proxy
