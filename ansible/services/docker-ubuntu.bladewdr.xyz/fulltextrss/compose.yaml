---

services:
  fivefilters-full-text-rss:
    container_name: fullrss
    restart: unless-stopped
    volumes:
      - "/home/scott/docker/fulltext/rss-cache:/var/www/html/cache"
      - "/home/scott/docker/fulltext/config:/custom/var/www/html/site_config/custom"
    image: 'heussd/fivefilters-full-text-rss:3.8.1@sha256:2a346545be8fbf60311ab74fc5b7fcbfbb9e31d2867bc797d28c330a8df95574'
    environment:
      - FTR_ADMIN_PASSWORD={{ ffr_admin_password }}
    labels:
      - traefik.enable=true
      - traefik.http.routers.fullrss.rule=Host(`fulltext.lan.bladewdr.xyz`)
      - traefik.http.routers.fullrss.entrypoints=https
      - traefik.http.routers.fullrss.middlewares=default-headers@file,https-redirectscheme@file
      - traefik.http.routers.fullrss.tls=true
      - traefik.http.routers.fullrss.service=fullrss
      - traefik.http.services.fullrss.loadbalancer.server.port=80
    networks:
      - proxy

networks:
  proxy:
    external: true
