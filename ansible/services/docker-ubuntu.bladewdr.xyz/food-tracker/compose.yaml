---
services:
  food-tracker:
    image: git.bladewdr.xyz/scottb/food-tracker:v1.4.0@sha256:85aa8b2e05ac8c941bde4ced387e53b2ae2f7a5b4e97b732c7ed78cd0fd7fac6
    container_name: food-tracker
    restart: unless-stopped
    volumes:
      - /home/scott/docker/food-tracker/data:/app/data
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATA_DIR=/app/data
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.food-tracker.rule=Host(`food.{{ TRAEFIK_HOST_DOMAIN }}`)"
      - "traefik.http.routers.food-tracker.entrypoints=https"
      - "traefik.http.services.food-tracker.loadbalancer.server.port=3000"
      - "traefik.http.routers.food-tracker.tls=true"
      - "traefik.http.routers.food-tracker.service=food-tracker"
      - "traefik.http.routers.food-tracker.middlewares=default-headers@file"

networks:
  proxy:
    external: true
