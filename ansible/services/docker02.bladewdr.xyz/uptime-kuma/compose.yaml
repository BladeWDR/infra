---
services:
  tailscale-uptimekuma:
    image: tailscale/tailscale:v1.104@sha256:ed6480b33c6eb67c9cbd203ed42b9fb57e361986725b6856def71b7a3d9e276c
    container_name: ${UPTIMEKUMA_TS_CONTAINER_NAME:-tailscale-uptimekuma}
    hostname: ${UPTIMEKUMA_TS_HOSTNAME:-uptimekuma}
    restart: unless-stopped
    environment:
      - TS_AUTHKEY={{ tailscale_authkey }}
      - TS_EXTRA_ARGS=${UPTIMEKUMA_TS_EXTRA_ARGS:---advertise-tags=tag:monitoring}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    volumes:
      - /apps/uptime-kuma/tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      - traefik
    labels:
      - joyride.host.name=${UPTIMEKUMA_HOST_NAME:-uptimekuma}.{{ APP0_HOST_DOMAIN }}
      - traefik.enable=${UPTIMEKUMA_TRAEFIK_ENABLE:-true}
      - traefik.http.routers.uptimekuma.entrypoints=websecure
      - traefik.http.routers.uptimekuma.rule=Host(`${UPTIMEKUMA_HOST_NAME:-uptimekuma}.{{ APP0_HOST_DOMAIN }}`)
      - traefik.http.routers.uptimekuma.tls=true
      - traefik.http.routers.uptimekuma.service=uptimekuma
      - traefik.http.routers.uptimekuma.middlewares=default-headers@file
      - traefik.http.services.uptimekuma.loadbalancer.server.port=3001
      - traefik.docker.network=traefik
      - com.centurylinklabs.watchtower.enable=${UPTIMEKUMA_TS_WATCHTOWER_ENABLE:-true}
      - autoheal=${UPTIMEKUMA_TS_AUTOHEAL:-true}

  uptime-kuma:
    image: louislam/uptime-kuma:2.5.8@sha256:20abea8c48a163cf0a7a5d5936ab418e4b742d908704e1f58f6c06e56a9c6b67
    container_name: ${UPTIMEKUMA_CONTAINER_NAME:-uptimekuma}
    restart: unless-stopped
    mem_limit: ${UPTIMEKUMA_MEM_LIMIT:-500m}
    network_mode: service:tailscale-uptimekuma
    depends_on:
      - tailscale-uptimekuma
    volumes:
      - /apps/uptime-kuma:/app/data
      - ${UPTIMEKUMA_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    environment:
      - TZ={{ host_timezone }}
    labels:
      - com.centurylinklabs.watchtower.enable=${UPTIMEKUMA_WATCHTOWER_ENABLE:-true}
      - autoheal=${UPTIMEKUMA_AUTOHEAL:-true}
