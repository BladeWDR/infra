---

services:
  vencord-redis:
    image: redis:alpine3.22@sha256:3e393dc9c57e628ebd5e0fc0bc4524f83632b6b873503d619e856af9322d4ef7
    container_name: vencord-redis
    networks:
      - traefik
    restart: unless-stopped
    volumes:
      - /apps/vencord/redis-data:/data
    environment:
      REDIS_ARGS: --save 300 1 60 10
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  vencord-backend:
    build: https://github.com/Vencord/Vencloud.git
    container_name: vencord-backend
    restart: unless-stopped
    networks:
      - traefik
    env_file:
      - vencord.env
    depends_on:
      vencord-redis:
        condition: service_healthy
    labels:
      - joyride.host.name=vencord-api.{{ APP0_HOST_DOMAIN }}
      - traefik.enable=${vencord_TRAEFIK_ENABLED:-true}
      - traefik.http.routers.vencord.entrypoints=websecure
      - traefik.http.routers.vencord.rule=Host(`vencord-api.{{ APP0_HOST_DOMAIN }}`)
      - traefik.http.services.vencord.loadbalancer.server.port=8080
      - traefik.http.routers.vencord.middlewares=default-headers@file
      - autoheal=${vencord_AUTOHEAL_ENABLED:-true}
