---
services:
  shlink:
    image: ghcr.io/shlinkio/shlink:5.1.8@sha256:68a722f7677008a50ccf3a9e570966bc37d7627fe6a870b86be28c5dcf9085ee 
    container_name: ${SHLINK_CONTAINER_NAME:-shlink}
    restart: ${SHLINK_RESTART:-unless-stopped}
    mem_limit: ${SHLINK_MEM_LIMIT:-200g}
    networks:
      - traefik
    volumes:
      - /apps/shlink:/etc/shlink/data
      - /etc/localtime:/etc/localtime:ro
    user: "1001"
    environment:
      - PUID=1001
      - PGID=1001
      - TZ={{ host_timezone }}
      - DEFAULT_DOMAIN=l.{{ APP0_HOST_DOMAIN }}
      - IS_HTTPS_ENABLED=${SHLINK_HTTPS_ENABLED:-true}
      # - SHELL_VERBOSITY=3 # Uncomment to get better logs
      # - GEOLITE_LICENSE_KEY=${SHLINK_GEOLITE_KEY} # optional
    labels:
      - joyride.host.name=l.{{ APP0_HOST_DOMAIN }}
      - traefik.enable=${SHLINK_TRAEFIK_ENABLED:-true}
      - traefik.http.routers.shlink.entrypoints=websecure
      - traefik.http.routers.shlink.rule=Host(`l.{{ APP0_HOST_DOMAIN }}`)
      - traefik.http.services.shlink.loadbalancer.server.port=8080
      - autoheal=${SHLINK_AUTOHEAL_ENABLED:-true}

  shlink-web-client:
    container_name: shlink-web-client
    restart: unless-stopped
    networks:
      - traefik
    environment:
      - SHLINK_SERVER_URL=https://l.{{ APP0_HOST_DOMAIN }}
      - SHLINK_SERVER_API_KEY={{ SHLINK_API_KEY }}
      - SHLINK_SERVER_NAME=Local
    image: shlinkio/shlink-web-client:4.9.0@sha256:9ea53f612d361de240555036065e2b8ea0cd0411b0125afaf2f7d39f2a928f18
    labels:
      - joyride.host.name=shlink.{{ APP0_HOST_DOMAIN }}
      - traefik.enable=true
      - traefik.http.routers.shlink-web.entrypoints=websecure
      - traefik.http.routers.shlink-web.rule=Host(`shlink.{{ APP0_HOST_DOMAIN }}`)
      - traefik.http.services.shlink-web.loadbalancer.server.port=8080
      - autoheal=${SHLINK_AUTOHEAL_ENABLED:-true}
