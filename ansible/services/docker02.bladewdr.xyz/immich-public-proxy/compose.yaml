---
services:
  immich-public-proxy:
    image: alangrainger/immich-public-proxy:4.0.0@sha256:54eb2a83f2d76a2e7e6b971638b011863ccb57a248e1d0a3e8a0f703c1f795dd
    container_name: immich-public-proxy
    restart: unless-stopped
    networks:
      - traefik
    environment:
      PUBLIC_BASE_URL: https://photos.{{ HOST_DOMAIN }}
      IMMICH_URL: https://{{ IMMICH_URL }}
    healthcheck:
      test: curl -s http://localhost:3000/share/healthcheck -o /dev/null || exit 1
      start_period: 10s
      timeout: 5s
    extra_hosts:
       - "{{ IMMICH_URL }}:100.92.59.43"
    labels:
      - traefik.enable=true
      - traefik.http.routers.immichproxy.entrypoints=websecure
      - traefik.http.routers.immichproxy.rule=Host(`photos.{{ HOST_DOMAIN }}`)
      - traefik.http.services.immichproxy.loadbalancer.server.port=3000
