services:
  synapse:
    image: ghcr.io/element-hq/synapse:v1.161.0@sha256:6b95dd129e35e97e8032cb759e5db4a516a5f7ef6c98d34d716fea1ae239b62a
    networks:
      - matrix-network
      - matrix-db
    container_name: matrix-synapse
    restart: unless-stopped
    environment:
      - SYNAPSE_CONFIG_PATH=/data/homeserver.yaml
    volumes:
      - /apps/matrix/config:/data
      - /apps/matrix/uploads:/data/uploads
      - /apps/matrix/media:/data/media
    depends_on:
      - db
    ports:
      - 127.0.0.1:8008:8008/tcp
      - 100.88.128.27:8008:8008/tcp
  synapse-admin:
    container_name: synapse-admin
    hostname: synapse-admin
    image: awesometechnologies/synapse-admin:0.11.4@sha256:a1c1f4662875f51ff1ca556a9eb7c802d9bc40ef58747b9efc163b42da3ad416
    networks:
      - matrix-network
    depends_on:
      - synapse
    volumes:
      - /apps/matrix/synapse-admin/config.json:/app/config.json:ro
    ports:
      - 100.88.128.27:8089:80
      - 127.0.0.1:8089:80
    restart: unless-stopped
  db:
    image: docker.io/postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: matrix-db
    environment:
      - POSTGRES_USER=synapse
      - POSTGRES_PASSWORD={{ matrix_db_password }}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - /apps/matrix/schemas:/var/lib/postgresql/data
    networks:
      - matrix-db
  element:
    image: vectorim/element-web:v1.12.28@sha256:a8f415462ab8d2600a592ba1b92bea51efe5a4d10eb738aab9bed769f7099613
    container_name: element-web
    volumes:
      - /apps/matrix/element-web/element-config.json:/app/config.json:ro
    ports:
      - 127.0.0.1:8088:80
    depends_on:
      - synapse
    networks:
      - matrix-network
    restart: unless-stopped

networks:
  matrix-db:
    internal: true
    driver: bridge
  matrix-network:
    driver: bridge
