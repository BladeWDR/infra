define command{
    command_name check_imap_cert
        command_line /opt/nagios/check_certs $HOSTALIAS$ 993
}

define command{
    command_name check_https_cert
        command_line /opt/nagios/check_certs $HOSTALIAS$ 443
}

define command {
    command_name check_dns_resolution
    command_line /opt/nagios/check_dns_resolution google.com $HOSTALIAS$ 
}

# Force IPv4 for PING checks. The $USER1$ (source-compiled) check_ping
# silently ignores -4 on dual-stack/Tailscale hosts, so use the
# monitoring-plugins binary, which honours -4.
define command {
    command_name    check_ping_ipv4
    command_line    /usr/lib/nagios/plugins/check_ping -4 -H $HOSTADDRESS$ -w $ARG1$ -c $ARG2$ -p 5
}
