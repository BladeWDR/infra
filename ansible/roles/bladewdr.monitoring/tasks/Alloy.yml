---
- name: Set fact for baremetal Alloy configuration.
  ansible.builtin.set_fact:
    baremetal_alloy_config: "{{ lookup('template', 'alloy-baremetal.j2') }}"
  when:
    - "'docker' not in group_names"
    - "rsyslog_receiver_server is not defined or rsyslog_receiver_server | length == 0 or inventory_hostname != rsyslog_receiver_server"

- name: Set fact for rsyslog Alloy configuration.
  ansible.builtin.set_fact:
    rsyslog_alloy_config: "{{ lookup('template', 'alloy-rsyslog.j2') }}"
  when:
    - "'docker' not in group_names"
    - "rsyslog_receiver_server is defined"
    - "rsyslog_receiver_server | length > 0"
    - "inventory_hostname == rsyslog_receiver_server"

- name: Install Alloy baremetal.
  when:
    - "'docker' not in group_names"
    - "rsyslog_receiver_server is not defined or rsyslog_receiver_server | length == 0 or inventory_hostname != rsyslog_receiver_server"
  ansible.builtin.include_role:
    name: grafana.grafana.alloy
  vars:
    alloy_config: "{{ baremetal_alloy_config }}"

- name: Install Alloy with rsyslog UDP receiver baremetal.
  when:
    - "'docker' not in group_names"
    - "rsyslog_receiver_server is defined"
    - "rsyslog_receiver_server | length > 0"
    - "inventory_hostname == rsyslog_receiver_server"
  ansible.builtin.include_role:
    name: grafana.grafana.alloy
  vars:
    alloy_config: "{{ rsyslog_alloy_config }}"

- name: Deploy Alloy container on Docker hosts.
  when:
    - "'docker' in group_names"
  block:
    - name: Ensure baremetal Alloy service is stopped and disabled on Docker hosts.
      ansible.builtin.systemd:
        name: alloy
        state: stopped
        enabled: false
      failed_when: false

    - name: Create target directory for Alloy Docker configuration.
      ansible.builtin.file:
        path: "{{ alloy_docker_config_dir }}/config"
        state: directory
        owner: "{{ admin_username }}"
        group: "{{ admin_username }}"
        mode: '0755'


    - name: Create Alloy config file for Docker.
      ansible.builtin.template:
        src: alloy-docker.j2
        dest: "{{ alloy_docker_config_dir }}/config/config.alloy"
        owner: "{{ admin_username }}"
        group: "{{ admin_username }}"
        mode: '0644'
      notify: restart alloy container

    - name: Check if /var/log/journal exists and is a directory.
      ansible.builtin.command: test -d /var/log/journal
      register: var_log_journal_check
      failed_when: false
      changed_when: false

    - name: Template the Alloy docker-compose file.
      ansible.builtin.template:
        src: alloy-compose.yml.j2
        dest: "{{ alloy_docker_config_dir }}/docker-compose.yml"
        owner: "{{ admin_username }}"
        group: "{{ admin_username }}"
        mode: '0644'
      notify: reload containers

    - name: Ensure Alloy Docker stack is running.
      community.docker.docker_compose_v2:
        project_src: "{{ alloy_docker_config_dir }}"
        state: present


